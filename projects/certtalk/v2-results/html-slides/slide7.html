<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}

h1 {
  color: #2c3e50;
  font-size: 22pt;
  margin: 8pt 0 4pt 0;
  text-align: center;
  font-weight: bold;
}

.subtitle {
  text-align: center;
  font-size: 12pt;
  color: #7f8c8d;
  margin: 0 0 6pt 0;
}

.gantt-container {
  margin: 0 40pt 6pt 40pt;
  flex: 1;
}

.gantt-header {
  display: flex;
  margin-bottom: 6pt;
  padding-left: 120pt;
}

.week-label {
  flex: 1;
  text-align: center;
  font-size: 9pt;
  font-weight: bold;
  color: #7f8c8d;
}

.week-label p {
  margin: 0;
}

.gantt-row {
  display: flex;
  align-items: center;
  margin-bottom: 16pt;
}

.task-label {
  width: 115pt;
  font-size: 12pt;
  font-weight: bold;
  color: #2c3e50;
  padding-right: 5pt;
}

.task-label p {
  margin: 0;
}

.gantt-timeline {
  flex: 1;
  display: flex;
  position: relative;
  height: 70pt;
}

.gantt-bar {
  height: 70pt;
  border-radius: 4pt;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11pt;
  font-weight: bold;
  color: #ffffff;
  position: absolute;
}

.gantt-bar p {
  margin: 0;
}

.phase1 {
  background: #3498db;
  left: 0;
  width: 33.33%;
}

.phase2 {
  background: #f39c12;
  left: 33.33%;
  width: 33.33%;
}

.phase3 {
  background: #e74c3c;
  left: 66.66%;
  width: 33.34%;
}

.deliverables {
  background: #fff9e6;
  border: 2pt solid #f39c12;
  border-radius: 6pt;
  padding: 6pt 12pt;
  margin: 0 35pt 20pt 35pt;
}

.deliverables-header {
  font-size: 13pt;
  font-weight: bold;
  color: #e67e22;
  margin: 0 0 4pt 0;
}

.deliverables-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 6pt;
  font-size: 10pt;
}

.deliverable-box {
  background: #ffffff;
  border: 2pt solid #f39c12;
  border-radius: 4pt;
  padding: 6pt;
  text-align: center;
}

.deliverable-box p {
  font-weight: bold;
  color: #2c3e50;
  margin: 0;
}
</style>
</head>
<body>
  <h1>Timeline & Deliverables</h1>
  <p class="subtitle">Oct 26 → Dec 6 (6 weeks)</p>

  <div class="gantt-container">
    <div class="gantt-header">
      <div class="week-label"><p>Week 1-2</p></div>
      <div class="week-label"><p>Week 3-4</p></div>
      <div class="week-label"><p>Week 5-6</p></div>
    </div>

    <div class="gantt-row">
      <div class="task-label"><p>Core Implementation</p></div>
      <div class="gantt-timeline">
        <div class="gantt-bar phase1">
          <p>Protocol + Encodings</p>
        </div>
      </div>
    </div>

    <div class="gantt-row">
      <div class="task-label"><p>Baselines & Dataset</p></div>
      <div class="gantt-timeline">
        <div class="gantt-bar phase2">
          <p>1,000 grids + Test harness</p>
        </div>
      </div>
    </div>

    <div class="gantt-row">
      <div class="task-label"><p>Experiments & Analysis</p></div>
      <div class="gantt-timeline">
        <div class="gantt-bar phase3">
          <p>Full runs + Paper</p>
        </div>
      </div>
    </div>
  </div>

  <div class="deliverables">
    <p class="deliverables-header">Final Deliverables:</p>
    <div class="deliverables-grid">
      <div class="deliverable-box">
        <p>Code (GitHub)</p>
      </div>
      <div class="deliverable-box">
        <p>Dataset (1K grids)</p>
      </div>
      <div class="deliverable-box">
        <p>Paper (Arxiv)</p>
      </div>
      <div class="deliverable-box">
        <p>Presentation</p>
      </div>
    </div>
  </div>
</body>
</html>
