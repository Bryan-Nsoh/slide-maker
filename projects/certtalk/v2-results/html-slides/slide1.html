<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}

h1 {
  color: #2c3e50;
  font-size: 24pt;
  margin: 12pt 0 8pt 0;
  text-align: center;
  font-weight: bold;
}

.grids-section {
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  margin: 0 20pt 8pt 20pt;
  flex: 0 0 auto;
}

.grid-container {
  text-align: center;
  flex: 1;
  max-width: 190pt;
}

.grid-container img {
  width: 150pt;
  height: 150pt;
}

.question {
  text-align: center;
  margin: 5pt 0;
  font-size: 15pt;
  font-weight: bold;
  color: #2c3e50;
}

.sendall-section {
  margin: 5pt 40pt 0 40pt;
  flex: 1;
}

.sendall-header {
  font-size: 15pt;
  font-weight: bold;
  color: #e74c3c;
  margin-bottom: 5pt;
}

.sendall-box {
  background: #f8f9fa;
  border-left: 5pt solid #e74c3c;
  padding: 8pt;
  border-radius: 4pt;
}

.sendall-box p {
  font-family: 'Courier New', monospace;
  font-size: 10pt;
  margin: 3pt 0;
  color: #2c3e50;
  line-height: 1.3;
}

.problem-box {
  background: #ffe6e6;
  border: 2pt solid #e74c3c;
  padding: 6pt;
  margin: 5pt 40pt 25pt 40pt;
  border-radius: 4pt;
}

.problem-box p {
  color: #c0392b;
  font-size: 12pt;
  font-weight: bold;
  margin: 2pt 0;
  line-height: 1.4;
}
</style>
</head>
<body>
  <h1>Two Robots Need to Agree. What Do They Send?</h1>

  <div class="grids-section">
    <div class="grid-container">
      <img src="../images/grid_robot_a.png" alt="Robot A's map">
    </div>
    <div class="grid-container">
      <img src="../images/grid_robot_b.png" alt="Robot B's map">
    </div>
    <div class="grid-container">
      <img src="../images/grid_union.png" alt="Union map">
    </div>
  </div>

  <p class="question">Can we reach G from S? → What to send?</p>

  <div class="sendall-section">
    <p class="sendall-header">❌ Send-All: Dump everything</p>
    <div class="sendall-box">
      <p>A: "Blocked: (2,1), (2,2), (2,3), (2,4)..."</p>
      <p>B: [rebuilds full map, runs solver]</p>
      <p>B: "Yes, path exists"</p>
    </div>
  </div>

  <div class="problem-box">
    <p>Problem: Raw data, not proof. No attribution. Need solver.</p>
  </div>
</body>
</html>
